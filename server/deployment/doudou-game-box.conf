server {
    listen 80;
    listen [::]:80;
    server_name panzhenghao.cn www.panzhenghao.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panzhenghao.cn www.panzhenghao.cn;

    ssl_certificate /etc/nginx/ssl/panzhenghao.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/panzhenghao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /smartRing {
        return 308 /smartRing/;
    }

    location = /smartRing/app/sr.apk {
        alias /opt/smartRing/downloads/sr.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=sr.apk";
        add_header Cache-Control "no-cache";
    }

    location /smartRing/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
